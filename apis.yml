aid: logicstar
name: Logicstar
description: >-
  LogicStar is an AI platform for autonomous software maintenance. Its AI agent
  investigates, reproduces, and fixes real bugs from a development team's backlog:
  it reproduces each bug with a failing test that proves the issue is real, then
  validates that a proposed fix actually resolves it before opening a pull request,
  keeping a human in the loop for review. LogicStar connects to a team's stack
  through integrations such as GitLab and Sentry rather than a public developer API.
  Founded in 2024 in Zurich by Boris Paskalev, Veselin Raychev, Mark Mueller, and
  Prof. Dr. Martin Vechev — the team behind DeepCode.ai (acquired by Snyk, now Snyk
  Code) and a spin-out of INSAIT/ETH Zurich — and backed by Northzone. As of this
  writing the product is in alpha with design partners and supports Python, with
  TypeScript, JavaScript, and Java support announced as coming soon.
